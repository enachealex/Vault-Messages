name: Build Vault Messages APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        env:
          SIGNING_KEY_ALIAS: vault
          SIGNING_KEY_PASSWORD: vaultmessages
          SIGNING_STORE_PASSWORD: vaultmessages
          SIGNING_STORE_FILE: ${{ github.workspace }}/signing/vault-messages.jks
        run: |
          chmod +x gradlew
          ./gradlew assembleFossRelease \
            -PVERSION_CODE=$((1000 + ${{ github.run_number }})) \
            -PVERSION_NAME="vault-${{ github.run_number }}"

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/foss/release/*.apk | head -1)
          cp "$APK" "vault-messages-${{ github.run_number }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vault-messages-apk
          path: vault-messages-*.apk

      - name: Publish release (phone-friendly download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" vault-messages-*.apk \
            --title "Vault Messages build ${{ github.run_number }}" \
            --notes "Download the .apk on your phone and open it to install or update." \
            --latest
