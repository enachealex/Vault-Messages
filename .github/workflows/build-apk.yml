name: Build Vault Messages APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      - name: Build signed release APK
        env:
          SIGNING_KEY_ALIAS: vault
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/signing/vault-release.p12
        run: |
          if [ -z "$SIGNING_STORE_PASSWORD" ]; then
            echo "::error title=Missing secret::Add the SIGNING_STORE_PASSWORD repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleFossRelease --console=plain \
            -PVERSION_CODE=$((1000 + ${{ github.run_number }})) \
            -PVERSION_NAME="vault-${{ github.run_number }}" 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler/Gradle errors as one annotation (readable from the API and the phone app).
          ERRS=$(grep -E "^e: |^> |What went wrong|ERROR:|error:" -A2 build.log | head -60)
          ERRS="${ERRS//'%'/'%25'}"; ERRS="${ERRS//$'\n'/'%0A'}"; ERRS="${ERRS//$'\r'/'%0D'}"
          echo "::error title=Build errors::${ERRS}"

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/foss/release/*.apk | head -1)
          cp "$APK" "vault-messages-${{ github.run_number }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: vault-messages-apk
          path: vault-messages-*.apk

      - name: Publish release (phone-friendly download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" vault-messages-*.apk \
            --title "Vault Messages build ${{ github.run_number }}" \
            --notes "Download the .apk on your phone and open it to install or update." \
            --latest
